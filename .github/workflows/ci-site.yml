name: CI - Website build

# Builds the psfdx website (site/) and runs its tests. The site is plain static files, so this only proves that it
# builds, that every link and file the page refers to exists, and that the copy and accessibility basics hold.
# The built site is attached to the run so a reviewer can download and look at it. Deployment is done by Cloudflare
# Pages from the repository, not by this workflow (see site/README.md).
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/reference/**'
      - 'skills/psfdx/**'
      - 'images/psfdx-logo.png'
      - '.github/workflows/ci-site.yml'

permissions:
  contents: read

jobs:
  site:
    name: Website build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate and verify command references
        shell: pwsh
        run: |
          ./site/Update-ModuleReference.ps1
          $changes = git status --porcelain -- site/src/modules docs/reference
          if ($changes) { throw "Generated command references are stale: $($changes -join ', ')" }
      - run: node --test "site/*.test.mjs"
      - run: node site/build.mjs
      - name: Package the PSFDX Agent Skill
        shell: pwsh
        run: |
          $skill = Join-Path $env:RUNNER_TEMP 'agent-skill/psfdx'
          $references = Join-Path $skill 'references'
          New-Item -ItemType Directory -Path $references | Out-Null
          Copy-Item -LiteralPath ./skills/psfdx/SKILL.md -Destination $skill
          Copy-Item -Path ./docs/reference/*.md -Destination $references
      - uses: actions/upload-artifact@v4
        with:
          name: psfdx-agent-skill
          path: ${{ runner.temp }}/agent-skill/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: psfdx-website
          path: site/dist
          if-no-files-found: error
