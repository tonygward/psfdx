name: CI - Suite install

# Builds the Gallery suite (the umbrella `psfdx` plus one package per module), publishes it to a local folder repository (nothing goes near the
# PowerShell Gallery), then installs from that repository the way a user would, on Ubuntu (PowerShell 7), Windows (PowerShell 7) and Windows
# PowerShell 5.1 with PowerShellGet:
#   - Save-Module psfdx must bring every module with no other command;
#   - Get-Module -ListAvailable 'psfdx*' and Get-Command -Module 'psfdx*' must see all of them with no import, each command from its own module;
#   - Import-Module psfdx must load them all and define no command twice, and a module saved on its own must work with its dependencies;
#   - an upgrade (a newer version next to an older one, Update-Module) and a missing dependency must behave (scripts/release/Test-PsfdxSuiteUpgrade.ps1).
# The checks live in scripts/release, so the release workflow runs the same ones against the real Gallery after publishing the suite.
on:
  pull_request:
    branches: [main]
    paths:
      - 'psfdx-*/**'
      - 'modules.ps1'
      - 'VERSION'
      - 'scripts/release/**'
      - '.github/workflows/ci-suite-install.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Suite install (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'ubuntu, pwsh', os: ubuntu-latest, shell: pwsh }
          - { name: 'windows, pwsh', os: windows-latest, shell: pwsh }
          - { name: 'windows, powershell 5.1', os: windows-latest, shell: powershell }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the packages and publish them to a local repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Two versions: the repository's, and one patch higher, so the upgrade can be tested.
          $info = ./scripts/release/New-PsfdxSuiteRepository.ps1 -RepositoryFolder (Join-Path $env:RUNNER_TEMP 'psfdx-repo') -RepositoryName psfdx-local -IncludeUpgrade
          Write-Host "Published $($info.Packages.Count) packages at $($info.OldVersion) and $($info.NewVersion): $($info.Packages -join ', ')"
          "REPO=$($info.Folder)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OLD_VERSION=$($info.OldVersion)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NEW_VERSION=$($info.NewVersion)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install from the repository and check the suite
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -eq 'Desktop') {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }
          Register-PSRepository -Name psfdx-local -SourceLocation $env:REPO -InstallationPolicy Trusted
          $dest = Join-Path $env:RUNNER_TEMP 'psfdx-installed'
          $alone = Join-Path $env:RUNNER_TEMP 'psfdx-alone'
          New-Item -ItemType Directory -Path $dest, $alone | Out-Null

          # One command, nothing else: every module must arrive with it.
          Save-Module -Name psfdx -RequiredVersion $env:OLD_VERSION -Repository psfdx-local -Path $dest -Force -ErrorAction Stop
          # A module on its own brings only its own dependencies.
          Save-Module -Name psfdx-logs -RequiredVersion $env:OLD_VERSION -Repository psfdx-local -Path $alone -Force -ErrorAction Stop

          ./scripts/release/Test-PsfdxSuite.ps1 -ModulePath $dest -Version $env:OLD_VERSION -StandalonePath $alone -StandaloneModule psfdx-logs
          ./scripts/release/Test-PsfdxHelp.ps1 -ModulePath $dest -Version $env:OLD_VERSION -Quick

      - name: Upgrade, Update-Module and a missing dependency
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $scratch = Join-Path $env:RUNNER_TEMP 'psfdx-upgrade'
          # -AllowInstall also runs Install-Module and Update-Module for the current user, which is fine on a runner that is thrown away.
          ./scripts/release/Test-PsfdxSuiteUpgrade.ps1 -RepositoryName psfdx-local -OldVersion $env:OLD_VERSION -NewVersion $env:NEW_VERSION -WorkPath $scratch -AllowInstall
