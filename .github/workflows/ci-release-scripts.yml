name: CI - Release scripts

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/release/**'
      - '.github/workflows/cd-*.yml'

permissions:
  contents: read

jobs:
  node-tests:
    name: Release script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/release/
