name: CI - Matrix gate tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/matrix/**'
      - '.github/workflows/gate-*.yml'
      - '.github/workflows/housekeeping-archive-prompt.yml'
      - '.github/workflows/ci*.yml'

permissions:
  contents: read

jobs:
  node-tests:
    name: Gate tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "scripts/matrix/*.test.mjs"
