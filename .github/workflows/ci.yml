name: CI

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Pester on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # The tests use Pester 5 syntax (Assert-MockCalled); Pester 6 can't load it
          Install-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99 -Force -Scope CurrentUser

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99
          Write-Host "Pester version: $((Get-Module Pester).Version)"
          Invoke-Pester -Path . -CI

